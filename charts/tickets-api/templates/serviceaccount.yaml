apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tickets-api.serviceAccountName" . }}
  labels:
    {{- include "tickets-api.labels" . | nindent 4 }}
# The process does not call the Kubernetes API. No Role is bound, and the
# token is not mounted, so a compromised container has no API credentials.
automountServiceAccountToken: false
