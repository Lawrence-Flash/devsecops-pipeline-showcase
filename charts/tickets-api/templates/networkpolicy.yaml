apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tickets-api.fullname" . }}
  labels:
    {{- include "tickets-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tickets-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the app port. Egress is omitted on purpose: this API makes no outbound calls.
    # kubectl port-forward is not subject to NetworkPolicy. A NodePort on kind is.
    - ports:
        - protocol: TCP
          port: 8000
