# Negative test. Kyverno must reject this pod. Trivy filesystem scans skip this directory.
apiVersion: v1
kind: Pod
metadata:
  name: privileged-demo
  namespace: tickets
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: busybox:1.36
      securityContext:
        privileged: true
        runAsNonRoot: true
        readOnlyRootFilesystem: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
